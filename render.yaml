# Render Blueprint — deploys the FastAPI backend.
# In Render: New → Blueprint → pick your repo. This file is auto-detected.
#
# Notes:
# - SQLite is used for the demo. The free plan's disk is ephemeral, so the DB
#   is re-seeded on every build (see buildCommand) to guarantee demo data.
# - After the Vercel frontend is live, set CORS_ORIGINS to its URL (see below)
#   and redeploy, or the browser will block API/WebSocket calls.
services:
  - type: web
    name: signal-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m app.seed"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: CORS_ORIGINS
        sync: false                  # set manually to your Vercel URL(s)
